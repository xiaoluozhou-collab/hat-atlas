<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>全球帽饰分析图鉴与创意融合</title>
  <meta name="description" content="全球帽饰分析图鉴与创意融合：收录全球 51 家设计师与手作帽饰品牌，支持中/英/法/意四语切换、销量/热度/艺术性排行、单帽文字二创与 2–3 顶帽饰融合创作。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20261127-5" />
</head>
<body>
  <header class="masthead">
    <div class="topbar">
      <div class="wrap topbar-inner">
        <span class="topbar-meta" id="topbar-meta">HAUTE MILLINERY ARCHIVE &amp; ATELIER</span>
        <div class="lang-switch" id="lang-switch" role="group" aria-label="Language">
          <button type="button" class="lang-btn active" data-lang="zh">中文</button>
          <span class="lang-sep">/</span>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
          <span class="lang-sep">/</span>
          <button type="button" class="lang-btn" data-lang="fr">FR</button>
          <span class="lang-sep">/</span>
          <button type="button" class="lang-btn" data-lang="it">IT</button>
        </div>
      </div>
    </div>

    <div class="wrap masthead-brand">
      <h1 id="site-title">全球帽饰分析图鉴与创意融合</h1>
      <p class="site-subtitle" id="site-subtitle">GLOBAL MILLINERY ARCHIVE &amp; CREATIVE FUSION</p>
    </div>

    <div class="nav-bar">
      <div class="wrap nav-inner">
        <nav class="tabs" role="tablist" id="tabs">
          <button role="tab" id="tab-gallery" data-view="gallery" class="tab active" data-i18n="tab_gallery">图鉴</button>
          <button role="tab" id="tab-studio" data-view="studio" class="tab"><span data-i18n="tab_studio">创意融合</span> <span id="studio-count" class="tab-badge" hidden>0</span></button>
          <button role="tab" id="tab-rank" data-view="rank" class="tab" data-i18n="tab_rank">排行榜</button>
          <button role="tab" id="tab-brands" data-view="brands" class="tab" data-i18n="tab_brands">品牌与渠道</button>
        </nav>
      </div>
    </div>

    <div class="stats-bar">
      <div class="wrap stats" id="stats"></div>
    </div>
  </header>

  <main class="wrap">
    <!-- 图鉴 -->
    <section id="view-gallery" class="view active" aria-labelledby="tab-gallery">
      <div class="toolbar">
        <input id="q" type="search" placeholder="搜索款式、名人、系列、材质…" />
        <select id="f-brand"><option value="">全部品牌（A–Z）</option></select>
        <select id="f-cat"><option value="">全部类别</option></select>
        <select id="f-sort">
          <option value="sales" data-i18n="sort_sales">按销量</option>
          <option value="heat" data-i18n="sort_heat">按热度</option>
          <option value="artistry" data-i18n="sort_artistry">按艺术性</option>
          <option value="year-desc" data-i18n="sort_year_desc">年份 新→旧</option>
          <option value="year-asc" data-i18n="sort_year_asc">年份 旧→新</option>
        </select>
      </div>
      <div class="gallery-bar">
        <p class="result-count" id="result-count"></p>
        <span class="gallery-tip" id="gallery-tip"></span>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <!-- 创意融合工坊 -->
    <section id="view-studio" class="view" aria-labelledby="tab-studio">
      <div class="studio-layout">
        <div class="studio-panel">
          <div class="studio-head">
            <div>
              <h2 data-i18n="studio_title">帽饰二创与融合工坊</h2>
              <p class="studio-sub" data-i18n="studio_sub">选中 1 顶帽子输入文字进行风格二创，或选中 2–3 顶帽子进行跨品牌基因融合，生成全新帽款图片与设计说明。</p>
            </div>
            <div class="studio-quick-actions">
              <button class="btn ghost sm" id="btn-pick-gallery" data-i18n="btn_pick_gallery">+ 去图鉴选帽</button>
              <button class="btn ghost sm" id="btn-random-fusion" data-i18n="btn_random_fusion">随机融合</button>
              <button class="btn ghost sm" id="btn-clear-selected" data-i18n="btn_clear">清空</button>
            </div>
          </div>

          <div class="studio-block">
            <div class="studio-label">
              <span><span data-i18n="selected_hats">已选参考帽款</span>（<b id="sel-num">0</b> / 3）</span>
              <span id="studio-mode-pill" class="badge"></span>
            </div>
            <div class="slot-grid" id="studio-slots"></div>
          </div>

          <div class="studio-block">
            <div class="studio-label"><span data-i18n="style_dir">风格方向（可多选叠加）</span></div>
            <div class="style-chips" id="style-chips"></div>
          </div>

          <div class="studio-block">
            <label class="studio-label" for="studio-prompt">
              <span data-i18n="prompt_label">二创 / 融合文字说明</span>
              <span class="rt-sub" data-i18n="prompt_hint">可描述材质、配色、帽檐变化、装饰元素等</span>
            </label>
            <textarea id="studio-prompt" class="studio-textarea" rows="4"></textarea>
          </div>

          <div class="studio-submit-row">
            <button type="button" class="btn primary-lg" id="btn-generate" data-i18n="btn_generate">生成二创新图与设计说明</button>
            <button type="button" class="btn ghost" id="btn-reroll" data-i18n="btn_reroll" hidden>换一版构图</button>
          </div>

          <details class="api-details">
            <summary data-i18n="api_summary">高级绘图引擎设置（默认免费免 Key 直接生成，可选填自有 OpenAI 兼容接口）</summary>
            <div class="api-grid">
              <label>
                <span data-i18n="api_endpoint_label">自定义 Endpoint（留空则使用默认免费 AI 绘图引擎）</span>
                <input id="api-endpoint" type="url" placeholder="https://api.openai.com/v1/images/generations" />
              </label>
              <label>
                <span data-i18n="api_key_label">API Key（仅保存在本地浏览器，不上传）</span>
                <input id="api-key" type="password" placeholder="sk-..." />
              </label>
              <label>
                <span data-i18n="api_model_label">模型名称</span>
                <input id="api-model" type="text" placeholder="gpt-image-1 / dall-e-3" />
              </label>
            </div>
          </details>
        </div>

        <div class="studio-result-panel" id="studio-result"></div>
      </div>

      <section class="saved-section" id="saved-section" hidden>
        <div class="studio-label">
          <span><span data-i18n="saved_title">我的二创与融合作品集</span>（<b id="saved-num">0</b>）</span>
        </div>
        <div class="saved-grid" id="saved-grid"></div>
      </section>
    </section>

    <!-- 排行榜 -->
    <section id="view-rank" class="view" aria-labelledby="tab-rank">
      <div class="rank-switch" id="rank-switch">
        <button data-rank="sales" class="chip active" data-i18n="rank_sales">销量榜</button>
        <button data-rank="heat" class="chip" data-i18n="rank_heat">热度榜</button>
        <button data-rank="artistry" class="chip" data-i18n="rank_artistry">艺术性榜</button>
        <button data-rank="brand" class="chip" data-i18n="rank_brand">品牌对比</button>
      </div>
      <div class="notice" id="rank-notice"></div>
      <div id="rank-body"></div>
    </section>

    <!-- 品牌 -->
    <section id="view-brands" class="view" aria-labelledby="tab-brands">
      <div class="brand-list" id="brand-list"></div>
    </section>
  </main>

  <!-- 悬浮融合选帽托盘 -->
  <div class="fusion-dock" id="fusion-dock" hidden>
    <div class="fusion-dock-inner">
      <div class="dock-thumbs" id="dock-thumbs"></div>
      <div class="dock-actions">
        <button type="button" class="btn ghost sm" id="dock-clear" data-i18n="btn_clear">清空</button>
        <button type="button" class="btn sm" id="dock-go"></button>
      </div>
    </div>
  </div>

  <footer class="foot-wrap">
    <div class="wrap foot">
      <div class="foot-brand" id="foot-brand">全球帽饰分析图鉴与创意融合</div>
      <div class="foot-copy" id="foot-copy"></div>
      <div class="foot-fx" id="fx-note"></div>
    </div>
  </footer>

  <!-- 详情弹层 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <article class="modal-card" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <button class="modal-close" data-close aria-label="Close">×</button>
      <div class="modal-body" id="modal-body"></div>
    </article>
  </div>

  <script src="data/all.js?v=20261127-4"></script>
  <script src="app.js?v=20261127-4"></script>
</body>
</html>
