name: Weekly Hat Atlas Update

on:
  schedule:
    # 每周日 02:00 UTC = 北京时间每周日 10:00 自动执行
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-atlas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run weekly hat catalog sync & image validation
        run: python3 scripts/weekly_update.py --sync-shopify --verify-images

      - name: Commit & push updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/atlas.json data/all.js dist/hat_atlas.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): weekly weekend update ($(date -u +'%Y-%m-%d'))"
            git push
          else
            echo "No catalog changes this weekend."
          fi
